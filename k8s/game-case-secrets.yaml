# Secrets for the encrypted single-owner case store and public sharing.
# Create with (never commit real values):
#   kubectl -n social-gt create secret generic game-case-secrets \
#     --from-literal=GT_APP_USERNAME=owner \
#     --from-literal=GT_APP_PASSWORD='<strong password>' \
#     --from-literal=GT_CASE_ENCRYPTION_KEY='<base64 of 32 random bytes>' \
#     --from-literal=GT_CASE_DB_PATH=/data/game-cases.sqlite3 \
#     --from-literal=GT_SHARE_TOKEN='<same value as the worker SHARE_TOKEN secret>'
apiVersion: v1
kind: Secret
metadata:
  name: game-case-secrets
  namespace: social-gt
type: Opaque
stringData:
  GT_APP_USERNAME: ""
  GT_APP_PASSWORD: ""
  GT_CASE_ENCRYPTION_KEY: ""
  GT_CASE_DB_PATH: /data/game-cases.sqlite3
  GT_SHARE_TOKEN: ""
  GT_SHARE_ENDPOINT: https://share.jakub.team/api/share
